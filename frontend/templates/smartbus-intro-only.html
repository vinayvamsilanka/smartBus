<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* ===== SmartBus intro: full-screen overlay above all elements ===== */
.sb-intro { 
    position: fixed !important; 
    inset: 0 !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important; 
    height: 100vh !important; 
    z-index: 2147483647 !important; 
    background: #05070d !important; 
    overflow: hidden !important; 
    margin: 0 !important;
    padding: 0 !important;
}
.sb-intro[hidden] { display: none !important; }
.sb-intro > canvas { 
    position: absolute !important; 
    inset: 0 !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important; 
    height: 100vh !important; 
    display: block !important; 
}
.sb-skip { 
    position: absolute !important; 
    z-index: 2147483647 !important; 
    right: max(20px, env(safe-area-inset-right, 0px)) !important; 
    top: calc(20px + env(safe-area-inset-top, 0px)) !important; 
    font-family: "JetBrains Mono", ui-monospace, monospace; 
    font-size: .75rem; 
    letter-spacing: .15em; 
    text-transform: uppercase; 
    color: #8b97a8; 
    background: rgba(5,7,13,.75); 
    border: 1px solid rgba(255,255,255,.16); 
    border-radius: 99px; 
    padding: 8px 18px; 
    cursor: pointer; 
    transition: all 0.2s ease; 
}
.sb-skip:hover { color: #eef3f8; background: rgba(15,23,42,.9); border-color: rgba(91,140,255,.5); }
.sb-skip:focus-visible { outline: 2px solid #5b8cff; outline-offset: 2px; }

/* exit: the intro wipes away left to right behind a glowing edge, revealing your site underneath */
.sb-intro.sb-exit { animation: sbWipe 1.15s cubic-bezier(.7,0,.2,1) forwards; }
.sb-intro.sb-exit .sb-skip { opacity: 0; pointer-events: none; }
@keyframes sbWipe { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 0 100%); } }

.sb-edge { 
    position: fixed !important; 
    top: 0 !important; 
    bottom: 0 !important; 
    left: 0 !important; 
    width: 4px !important; 
    height: 100vh !important;
    z-index: 2147483647 !important; 
    pointer-events: none !important; 
    opacity: 0; 
    background: linear-gradient(180deg, transparent, #9ff7e8 25%, #9ff7e8 75%, transparent); 
    box-shadow: 0 0 34px 10px rgba(45,225,210,.55); 
}
.sb-edge.sb-go { animation: sbEdge 1.15s cubic-bezier(.7,0,.2,1) forwards; }
@keyframes sbEdge { 0% { left: 0; opacity: 1; } 92% { opacity: 1; } 100% { left: 100%; opacity: 0; } }

/* Ensure base site elements (navbar, floating chat) are completely hidden while intro is active */
body.sb-intro-active .navbar,
body.sb-intro-active #ai-chat-btn,
body.sb-intro-active .chat-window,
body.sb-intro-active .chat-box,
body:has(.sb-intro:not([hidden])) .navbar,
body:has(.sb-intro:not([hidden])) #ai-chat-btn {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
}

</style>

<!-- ===== SmartBus intro markup ===== -->
<div class="sb-edge" id="sbEdge"></div>
<div class="sb-intro" id="sbIntro" role="img" aria-label="SmartBus AI is loading">
  <canvas id="sbCv"></canvas>
  <button class="sb-skip" id="sbSkip" type="button">Skip</button>
</div>

    [...near].sort((a, b) => Math.abs(a.x - doorX) - Math.abs(b.x - doorX)).forEach((p, k) => p.order = k);
