<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBus | Secure Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0b0f19 80%);
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(16px);
            padding: 3rem;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-box h1 {
            font-family: 'Outfit';
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
        }

        .login-box p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .alert-error {
            background: rgba(248, 113, 113, 0.1);
            color: var(--accent-error);
            border: 1px solid var(--accent-error);
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .alert-success {
            background: rgba(52, 211, 153, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
            color: #fff;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter';
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>

<body>

    <div class="login-box">
        <i class="fa-solid fa-server" style="font-size: 3rem; color: var(--accent-purple); margin-bottom: 1.5rem;"></i>
        <h1>System Access</h1>
        <p>Enterprise Admin Portal</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert-{{ category }}"><i class="fa-solid fa-triangle-exclamation"></i> {{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_ui.login') }}">
            <div class="form-group" style="text-align: left;">
                <label>Administrator Email</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-envelope"
                        style="position: absolute; left: 1rem; top: 1rem; color: var(--text-secondary);"></i>
                    <input type="email" name="email" class="form-control" style="padding-left: 2.8rem;"
                        placeholder="admin@smartbus.com" required>
                </div>
            </div>

            <div class="form-group" style="text-align: left;">
                <label>Secure Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock"
                        style="position: absolute; left: 1rem; top: 1rem; color: var(--text-secondary);"></i>
                    <input type="password" name="password" class="form-control" style="padding-left: 2.8rem;"
                        placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Authenticate <i class="fa-solid fa-shield-halved"></i></button>
        </form>
    </div>

</body>

</html>
